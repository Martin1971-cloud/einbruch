name: Release-Candidate

# Läuft automatisch, wenn die Version im Projekt auf main geändert wird (godot/project.godot).
# Dann entsteht Tag und Release mit dem Versionsnamen. Ein Tag rc* (von Hand gesetzt) startet ihn ebenfalls.
on:
  push:
    branches:
      - main
    paths:
      - "godot/project.godot"
    tags:
      - "rc*"
      - "Rc*"
      - "RC*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bestimmen und prüfen, ob gebaut werden soll
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME}"
            RUN=ja
          else
            NAME=$(grep -oP 'config/version="\K[^"]+' godot/project.godot)
            if git ls-remote --tags origin "refs/tags/${NAME}" | grep -q .; then
              RUN=nein
            else
              RUN=ja
            fi
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "run=${RUN}" >> "$GITHUB_OUTPUT"
          echo "Version: ${NAME}, bauen: ${RUN}"

      - name: Godot installieren
        if: steps.version.outputs.run == 'ja'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Export-Vorlagen installieren
        if: steps.version.outputs.run == 'ja'
        run: |
          curl -fsSL --retry 3 --retry-delay 10 -o vorlagen.tpz \
            https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p vorlagen
          unzip -q vorlagen.tpz -d vorlagen
          ZIEL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$ZIEL"
          cp -r vorlagen/templates/. "$ZIEL"/
          cp vorlagen/version.txt "$ZIEL"/ 2>/dev/null || echo "${GODOT_VERSION}.stable" > "$ZIEL"/version.txt
          ls "$ZIEL" | grep -i "windows_release_x86_64.exe\|version.txt"

      - name: Projekt importieren und Tests ausführen
        if: steps.version.outputs.run == 'ja'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          cd godot
          godot --headless --path . --import > /dev/null 2>&1 || true
          GODOT=godot bash tools/pruefe_alles.sh "$RUNNER_TEMP/pruefung"

      - name: Windows und Linux exportieren
        if: steps.version.outputs.run == 'ja'
        run: |
          cd godot
          mkdir -p ../build/windows ../build/linux
          for preset in "Windows Desktop" "Linux"; do
            if ! godot --headless --path . --export-release "$preset" > export.log 2>&1; then
              echo "Export '$preset' fehlgeschlagen:"
              grep -iE "error|fehler|failed|cannot|could not" export.log | sed 's/^/::error::/'
              cat export.log
              exit 1
            fi
          done

      - name: Pakete erstellen und Prüfsummen bilden
        if: steps.version.outputs.run == 'ja'
        run: |
          NAME="${{ steps.version.outputs.name }}"
          cd build
          (cd windows && zip -q -r "../../Der-Einbruch-${NAME}-windows.zip" .)
          (cd linux && zip -q -r "../../Der-Einbruch-${NAME}-linux.zip" .)
          cd ..
          sha256sum Der-Einbruch-${NAME}-*.zip > SHA256SUMS.txt

      - name: Änderungsliste seit dem letzten RC
        if: steps.version.outputs.run == 'ja'
        run: |
          NAME="${{ steps.version.outputs.name }}"
          VORHER=$(git tag --list 'rc*' 'Rc*' 'RC*' --sort=-v:refname | grep -v "^${NAME}$" | head -1 || true)
          if [ -n "$VORHER" ]; then BEREICH="${VORHER}..HEAD"; else BEREICH="HEAD"; fi
          { echo "## Änderungen seit ${VORHER:-Beginn}"; echo; git log --no-merges --pretty="- %s" "$BEREICH"; } > AENDERUNGEN.md

      - name: Release mit Tag veröffentlichen
        if: steps.version.outputs.run == 'ja'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: "Der Einbruch ${{ steps.version.outputs.name }}"
          body_path: AENDERUNGEN.md
          prerelease: true
          files: |
            Der-Einbruch-*-windows.zip
            Der-Einbruch-*-linux.zip
            SHA256SUMS.txt
